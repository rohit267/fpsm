name: Release

# Push a tag like v0.1.0 and this builds fpsm.exe and publishes a GitHub release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: ./scripts/build.ps1 -Version "${{ github.ref_name }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/fpsm.exe"
          "dist/fpsm-${{ github.ref_name }}-windows-x64.zip"
          "dist/SHA256SUMS.txt"
          --title "fpsm ${{ github.ref_name }}"
          --generate-notes
          --notes "Download **fpsm.exe**, run it, and accept the administrator prompt (Windows only lets admins read frame events). The exe is not code-signed, so SmartScreen may say 'Windows protected your PC': click More info, then Run anyway. Checksums are in SHA256SUMS.txt."
